name: Update nW roster

on:
  schedule:
    # Every 15 minutes, offset from :00 when GitHub's scheduler is busiest.
    # GitHub may start scheduled runs late under load; that's expected.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write

# Never run two updates at once — the second would race the first's push.
concurrency:
  group: update-roster
  cancel-in-progress: false

jobs:
  update-roster:
    runs-on: ubuntu-latest
    steps:
      # ref: main = the branch as it is when this job starts. Without it a run
      # that queued behind another (concurrency above) would check out the
      # older commit it was triggered on and then conflict with that run's push.
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest ratings
        run: python scripts/fetch_ratings.py

      - name: Commit changes if anything updated
        run: |
          git config user.name "nw-roster-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update roster data [automated]"
          # Pick up any commit pushed since checkout (e.g. a manual edit). If
          # that commit touched the same data, skip this save rather than fail:
          # the next run, 15 minutes later, writes fresh data anyway.
          if ! git pull --rebase; then
            git rebase --abort
            echo "::warning::Data changed upstream during this run; skipping this save (next run will update)."
            exit 0
          fi
          git push
